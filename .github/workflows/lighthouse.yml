name: Lighthouse

# Core Web Vitals budgets on a throttled mobile profile, against seeded demo data (docs/architecture/PERFORMANCE_AND_SCALABILITY.md §1).
# ADVISORY for now: budgets are "warn" and the job may not fail the build. After a few green baselines, switch the
# assertions in lighthouserc.json from "warn" to "error" and remove continue-on-error below.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: lighthouse-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    continue-on-error: true
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: velmora
        ports: ["3306:3306"]
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20

    env:
      APP_ENV: local
      APP_URL: http://127.0.0.1:8000
      DB_CONNECTION: mariadb
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: velmora
      DB_USERNAME: root
      DB_PASSWORD: root
      CACHE_STORE: file
      SESSION_DRIVER: file
      QUEUE_CONNECTION: sync
      FILESYSTEM_DISK: local
      CATALOG_MEDIA_DISK: public

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, intl, pdo_mysql, gd, zip, bcmath
          coverage: none
          tools: composer:v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: composer install --no-interaction --prefer-dist --no-dev --optimize-autoloader
      - run: npm ci && npm run build

      - name: Seed demo data
        run: |
          cp .env.example .env
          php artisan key:generate --ansi
          php artisan storage:link
          php artisan migrate --force
          php artisan db:seed --force
          php artisan db:seed --class='App\Modules\Catalog\Database\Seeders\DemoCatalogSeeder' --force
          php artisan db:seed --class='App\Modules\Cms\Database\Seeders\DemoCmsSeeder' --force
          php artisan catalog:reindex && php artisan search:reindex

      - name: Start the app
        run: |
          php artisan serve --host=127.0.0.1 --port=8000 > /tmp/serve.log 2>&1 &
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:8000/healthz && break || sleep 1; done

      - name: Smoke-check the pages Lighthouse will load
        run: |
          for u in /en /bn /en/shop /en/c/clothing /en/p/cotton-panjabi; do
            code=$(curl -s -o /tmp/page.html -w "%{http_code}" "http://127.0.0.1:8000$u")
            echo "$u -> $code"
            if [ "$code" != "200" ]; then head -c 1500 /tmp/page.html; echo; tail -n 30 storage/logs/laravel.log 2>/dev/null; tail -n 20 /tmp/serve.log; fi
          done

      - name: Lighthouse (mobile, throttled)
        run: npx --yes @lhci/cli@0.14.x autorun --config=lighthouserc.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-reports
          path: .lighthouseci
