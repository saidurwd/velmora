# Local development services for Velmora. Host ports are in a private range (6390/1035/8035/3317/9010) because
# other local projects commonly occupy 6379/1025/8025/3307/9000.
# The app itself runs on the host (php artisan serve / npm run dev) against the local MariaDB `velmora`.
#   docker compose up -d                       -> redis, s3 (SeaweedFS + buckets), mailpit
#   docker compose --profile ci-parity up -d   -> adds a throwaway MariaDB 11.4 on :3317 (CI parity, never your data)
services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["127.0.0.1:6390:6379"]
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  # S3-compatible object storage for dev (BD-05). MinIO no longer publishes public images, so SeaweedFS (Apache-2.0) is used.
  # Buckets: velmora-media (public catalog media) and velmora-private (digital goods; signed URLs only).
  s3:
    image: chrislusf/seaweedfs:latest
    command: ["mini", "-dir=/data"]
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-velmora}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-velmora-dev-secret}
    ports: ["127.0.0.1:9010:8333"]
    volumes: ["s3-data:/data"]

  s3-setup:
    image: amazon/aws-cli:latest
    depends_on: [s3]
    restart: "no"
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-velmora}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-velmora-dev-secret}
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        for i in $$(seq 1 30); do
          aws --endpoint-url http://s3:8333 s3 ls >/dev/null 2>&1 && break
          sleep 2
        done
        aws --endpoint-url http://s3:8333 s3 mb s3://velmora-media 2>/dev/null || true
        aws --endpoint-url http://s3:8333 s3 mb s3://velmora-private 2>/dev/null || true
        echo "buckets ready"

  mailpit:
    image: axllent/mailpit:latest
    ports: ["127.0.0.1:1035:1025", "127.0.0.1:8035:8025"]

  mariadb-ci:
    profiles: ["ci-parity"]
    image: mariadb:11.4
    environment:
      MARIADB_ROOT_PASSWORD: ci-root
      MARIADB_DATABASE: velmora_test
      MARIADB_CHARACTER_SET: utf8mb4
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_uca1400_ai_ci"]
    ports: ["127.0.0.1:3317:3306"]

volumes:
  redis-data:
  s3-data:
